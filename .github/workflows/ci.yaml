# Lint, types, tests and template synthesis, for both projects. Needs no AWS
# credentials and is granted none: deploying is deploy.yaml, which calls this workflow
# first and reaches AWS only once every job here has passed.
#
# Each job is gated on what the change actually touched. `changes` lists the changed
# files once and turns them into one boolean per job, and each job carries its own
# `if`. A docs-only pull request then runs nothing but `changes`.
#
# This is deliberately not test selection. The two projects are the granularity, and a
# job that runs, runs whole: a map from source files to the tests that cover them goes
# stale the first time somebody moves a module, and the tests worth most are the ones
# that fail on a change nobody thought to re-check.
#
# A skipped job reports as skipped, not as missing, so it satisfies a required status
# check under branch protection. Gating with `paths:` on the `on:` trigger instead
# would not: the check would never report at all, and a rule requiring it would block
# every docs-only pull request for good.
#
# Every action is pinned to a commit SHA, with its version in a comment, because a tag
# can be moved to new code and a SHA cannot. .github/dependabot.yml keeps the pins
# current.

name: CI

on:
  pull_request:
  # Called by deploy.yaml on a merge to main. Deliberately no `push` trigger as well:
  # that would run this twice per merge, once alone and once inside the deploy, and
  # leave two verdicts on one commit.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, explicitly. A called workflow inherits its caller's token, and deploy.yaml
# holds `id-token: write`; stating what this needs keeps that out of the tests' reach.
permissions:
  contents: read
  # `changes` reads a pull request's file list through the API, and without this fails
  # with "Resource not accessible by integration". deploy.yaml grants it too: a called
  # workflow cannot hold a permission its caller does not, and asking for one fails
  # the whole run before a step executes.
  pull-requests: read

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Not on a manual run. A `workflow_dispatch` of the deploy has no change to
      # compare against, so it leaves both outputs unset and the jobs below run whole.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # One filter per job, naming what that job reads. A filter matches when any
          # of its patterns matches a changed file.
          filters: |
            workflows: &workflows
              - '.github/workflows/**'
            app:
              - *workflows
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
            infra:
              - *workflows
              - 'infra/**'
              # Synth packages src/ as the Lambda asset, and the infra tests name the
              # handler's import path, so moving or renaming a module breaks them.
              - 'src/**'

  app:
    name: Application
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # uv fetches the Python named in .python-version itself, on first sync.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  infra:
    name: Infrastructure
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          working-directory: infra

      - run: uv sync --locked

      - run: npm ci --silent

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      # No credentials: the account is pinned in config.py and nothing makes an AWS
      # lookup at synth time. If this step ever asks for credentials, something has
      # introduced one — prefer an SSM parameter resolved at deploy time instead.
      - name: Synth
        run: npx --no-install cdk synth --quiet
